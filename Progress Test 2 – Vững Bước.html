@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1428; --paper:#171D35; --ink:#EEF0F8; --muted:#A4AAC4; --line:#2B3253;
  --accent:#F6A3BB; --accent-ink:#1A1030; --accent-soft:#2D2443;
  --rose:#FF9DB5; --pink:#F07C8A; --blush:#F9B5CA;
  --hl:#5C2B44; --hl-ink:#FFE6EE;
  --done:#F6A3BB; --done-ink:#1A1030;
  --ok:#5FD08F; --ok-soft:#163824; --bad:#FF9A66; --bad-soft:#3E2216; --warn:#FBBF24;
  --wm-op:.09; --brandbox:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1428; --paper:#171D35; --ink:#EEF0F8; --muted:#A4AAC4; --line:#2B3253;
  --accent:#F6A3BB; --accent-ink:#1A1030; --accent-soft:#2D2443;
  --rose:#FF9DB5; --pink:#F07C8A; --blush:#F9B5CA;
  --hl:#5C2B44; --hl-ink:#FFE6EE;
  --done:#F6A3BB; --done-ink:#1A1030;
  --ok:#5FD08F; --ok-soft:#163824; --bad:#FF9A66; --bad-soft:#3E2216; --warn:#FBBF24;
  --wm-op:.09; --brandbox:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body::after{content:"";position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:110px;height:110px;background:var(--wm-img) center/contain no-repeat;opacity:.12;pointer-events:none;z-index:2}
body.exam-mode::after{bottom:calc(84px + env(safe-area-inset-bottom,0px));width:80px;height:80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
a{color:var(--rose)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.wm{position:relative;isolation:isolate}
.wm::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--wm-img) center 45%/min(55%,320px) no-repeat;opacity:var(--wm-op)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 20px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pink{background:var(--pink);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

const TESTS={
t1:{id:'t1',name:'Đề 1',parts:[
{n:1,range:[1,13],title:'Why being bored is stimulating – and useful, too',sub:'This most common of emotions is turning out to be more interesting than we thought',
paras:[
['A','We all know how it feels – it’s impossible to keep your mind on anything, time stretches out, and all the things you could do seem equally unlikely to make you feel better. But defining boredom so that it can be studied in the lab has proved difficult. For a start, it can include a lot of other mental states, such as frustration, apathy, depression and indifference. There isn’t even agreement over whether boredom is always a low-energy, flat kind of emotion or whether feeling agitated and restless counts as boredom, too. In his book, <i>Boredom: A Lively History</i>, Peter Toohey at the University of Calgary, Canada, compares it to disgust – an emotion that motivates us to stay away from certain situations. ‘If disgust protects humans from infection, boredom may protect them from “infectious” social situations,’ he suggests.'],
['B','By asking people about their experiences of boredom, Thomas Goetz and his team at the University of Konstanz in Germany have recently identified five distinct types: indifferent, calibrating, searching, reactant and apathetic. These can be plotted on two axes – one running left to right, which measures low to high arousal, and the other from top to bottom, which measures how positive or negative the feeling is. Intriguingly, Goetz has found that while people experience all kinds of boredom, they tend to specialise in one. Of the five types, the most damaging is ‘reactant’ boredom with its explosive combination of high arousal and negative emotion. The most useful is what Goetz calls ‘indifferent’ boredom: someone isn’t engaged in anything satisfying but still feels relaxed and calm. However, it remains to be seen whether there are any character traits that predict the kind of boredom each of us might be prone to.'],
['C','Psychologist Sandi Mann at the University of Central Lancashire, UK, goes further. ‘All emotions are there for a reason, including boredom,’ she says. Mann has found that being bored makes us more creative. ‘We’re all afraid of being bored but in actual fact it can lead to all kinds of amazing things,’ she says. In experiments published last year, Mann found that people who had been made to feel bored by copying numbers out of the phone book for 15 minutes came up with more creative ideas about how to use a polystyrene cup than a control group. Mann concluded that a passive, boring activity is best for creativity because it allows the mind to wander. In fact, she goes so far as to suggest that we should seek out more boredom in our lives.'],
['D','Psychologist John Eastwood at York University in Toronto, Canada, isn’t convinced. ‘If you are in a state of mind-wandering you are not bored,’ he says. ‘In my view, by definition boredom is an undesirable state.’ That doesn’t necessarily mean that it isn’t adaptive, he adds. ‘Pain is adaptive – if we didn’t have physical pain, bad things would happen to us. Does that mean that we should actively cause pain? No. But even if boredom has evolved to help us survive, it can still be toxic if allowed to fester.’ For Eastwood, the central feature of boredom is a failure to put our ‘attention system’ into gear. This causes an inability to focus on anything, which makes time seem to go painfully slowly. What’s more, your efforts to improve the situation can end up making you feel worse. ‘People try to connect with the world and if they are not successful there’s that frustration and irritability,’ he says. Perhaps most worryingly, says Eastwood, repeatedly failing to engage attention can lead to a state where we don’t know what to do any more, and no longer care.'],
['E','Eastwood’s team is now trying to explore why the attention system fails. It’s early days but they think that at least some of it comes down to personality. Boredom proneness has been linked with a variety of traits. People who are motivated by pleasure seem to suffer particularly badly. Other personality traits, such as curiosity, are associated with a high boredom threshold. More evidence that boredom has detrimental effects comes from studies of people who are more or less prone to boredom. It seems those who bore easily face poorer prospects in education, their career and even life in general. But of course, boredom itself cannot kill – it’s the things we do to deal with it that may put us in danger. What can we do to alleviate it before it comes to that? Goetz’s group has one suggestion. Working with teenagers, they found that those who ‘approach’ a boring situation – in other words, see that it’s boring and get stuck in anyway – report less boredom than those who try to avoid it by using snacks, TV or social media for distraction.'],
['F','Psychologist Francoise Wemelsfelder speculates that our over-connected lifestyles might even be a new source of boredom. ‘In modern human society there is a lot of overstimulation but still a lot of problems finding meaning,’ she says. So instead of seeking yet more mental stimulation, perhaps we should leave our phones alone, and use boredom to motivate us to engage with the world in a more meaningful way.']
],

{n:2,range:[14,26],title:'Why zoos are good',sub:'Scientist David Hone makes the case for zoos',
paras:[
['A','In my view, it is perfectly possible for many species of animals living in zoos or wildlife parks to have a quality of life as high as, or higher than, in the wild. Animals in good zoos get a varied and high-quality diet with all the supplements required, and any illnesses they might have will be treated. Their movement might be somewhat restricted, but they have a safe environment in which to live, and they are spared bullying and social ostracism by others of their kind. They do not suffer from the threat or stress of predators, or the irritation and pain of parasites or injuries. The average captive animal will have a greater life expectancy compared with its wild counterpart, and will not die of drought, of starvation or in the jaws of a predator. A lot of very nasty things happen to truly ‘wild’ animals that simply don’t happen in good zoos, and to view a life that is ‘free’ as one that is automatically ‘good’ is, I think, an error. Furthermore, zoos serve several key purposes.'],
['B','Firstly, zoos aid conservation. Colossal numbers of species are becoming extinct across the world, and many more are increasingly threatened and therefore risk extinction. Moreover, some of these collapses have been sudden, dramatic and unexpected, or were simply discovered very late in the day. A species protected in captivity can be bred up to provide a reservoir population against a population crash or extinction in the wild. A good number of species only exist in captivity, with many of these living in zoos. Still more only exist in the wild because they have been reintroduced from zoos, or have wild populations that have been boosted by captive bred animals. Without these efforts there would be fewer species alive today. Although reintroduction successes are few and far between, the numbers are increasing, and the very fact that species have been saved or reintroduced as a result of captive breeding proves the value of such initiatives.'],
['C','Zoos also provide education. Many children and adults, especially those in cities, will never see a wild animal beyond a fox or pigeon. While it is true that television documentaries are becoming ever more detailed and impressive, and many natural history specimens are on display in museums, there really is nothing to compare with seeing a living creature in the flesh, hearing it, smelling it, watching what it does and having the time to absorb details. That alone will bring a greater understanding and perspective to many, and hopefully give them a greater appreciation for wildlife, conservation efforts and how they can contribute.'],
['D','In addition to this, there is also the education that can take place in zoos through signs, talks and presentations which directly communicate information to visitors about the animals they are seeing and their place in the world. This was an area where zoos used to be lacking, but they are now increasingly sophisticated in their communication and outreach work. Many zoos also work directly to educate conservation workers in other countries, or send their animal keepers abroad to contribute their knowledge and skills to those working in zoos and reserves, thereby helping to improve conditions and reintroductions all over the world.'],
['E','Zoos also play a key role in research. If we are to save wild species and restore and repair ecosystems we need to know about how key species live, act and react. Being able to undertake research on animals in zoos where there is less risk and fewer variables means real changes can be effected on wild populations. Finding out about, for example, the oestrus cycle of an animal or its breeding rate helps us manage wild populations. Procedures such as capturing and moving at-risk or dangerous individuals are bolstered by knowledge gained in zoos about doses for anaesthetics, and by experience in handling and transporting animals. This can make a real difference to conservation efforts and to the reduction of human-animal conflicts, and can provide a knowledge base for helping with the increasing threats of habitat destruction and other problems.'],
['F','In conclusion, considering the many ongoing global threats to the environment, it is hard for me to see zoos as anything other than essential to the long-term survival of numerous species. They are vital not just in terms of protecting animals, but as a means of learning about them to aid those still in the wild, as well as educating and informing the general population about these animals and their world so that they can assist or at least accept the need to be more environmentally conscious. Without them, the world would be, and would increasingly become, a much poorer place.']
],

{n:3,range:[27,40],title:'Motivational factors and the hospitality industry',sub:'',
paras:[
['','A critical ingredient in the success of hotels is developing and maintaining superior performance from their employees. How is that accomplished? What Human Resource Management (HRM) practices should organizations invest in to acquire and retain great employees?'],
['','Some hotels aim to provide superior working conditions for their employees. The idea originated from workplaces – usually in the non-service sector – that emphasized fun and enjoyment as part of work-life balance. By contrast, the service sector, and more specifically hotels, has traditionally not extended these practices to address basic employee needs, such as good working conditions.'],
['','Pfeffer (1994) emphasizes that in order to succeed in a global business environment, organizations must make investment in Human Resource Management (HRM) to allow them to acquire employees who possess better skills and capabilities than their competitors. This investment will be to their competitive advantage. Despite this recognition of the importance of employee development, the hospitality industry has historically been dominated by underdeveloped HR practices (Lucas, 2002).'],
['','Lucas also points out that ‘the substance of HRM practices does not appear to be designed to foster constructive relations with employees or to represent a managerial approach that enables developing and drawing out the full potential of people, even though employees may be broadly satisfied with many aspects of their work’ (Lucas, 2002). In addition, or maybe as a result, high employee turnover has been a recurring problem throughout the hospitality industry. Among the many cited reasons are low compensation, inadequate benefits, poor working conditions and compromised employee morale and attitudes (Maroudas et al., 2008).'],
['','Ng and Sorensen (2008) demonstrated that when managers provide recognition to employees, motivate employees to work together, and remove obstacles preventing effective performance, employees feel more obligated to stay with the company. This was succinctly summarized by Michel et al. (2013): ‘[P]roviding support to employees gives them the confidence to perform their jobs better and the motivation to stay with the organization.’ Hospitality organizations can therefore enhance employee motivation and retention through the development and improvement of their working conditions. These conditions are inherently linked to the working environment.'],
['','While it seems likely that employees’ reactions to their job characteristics could be affected by a predisposition to view their work environment negatively, no evidence exists to support this hypothesis (Spector et al., 2000). However, given the opportunity, many people will find something to complain about in relation to their workplace (Poulston, 2009). There is a strong link between the perceptions of employees and particular factors of their work environment that are separate from the work itself, including company policies, salary and vacations.'],
['','Such conditions are particularly troubling for the luxury hotel market, where high-quality service, requiring a sophisticated approach to HRM, is recognized as a critical source of competitive advantage (Maroudas et al., 2008). In a real sense, the services of hotel employees represent their industry (Schneider and Bowen, 1993). This representation has commonly been limited to guest experiences. This suggests that there has been a dichotomy between the guest environment provided in luxury hotels and the working conditions of their employees.'],
['','It is therefore essential for hotel management to develop HRM practices that enable them to inspire and retain competent employees. This requires an understanding of what motivates employees at different levels of management and different stages of their careers (Enz and Siguaw, 2000). This implies that it is beneficial for hotel managers to understand what practices are most favorable to increase employee satisfaction and retention.'],
['','Herzberg (1966) proposes that people have two major types of needs, the first being extrinsic motivation factors relating to the context in which work is performed, rather than the work itself. These include working conditions and job security. When these factors are unfavorable, job dissatisfaction may result. Significantly, though, just fulfilling these needs does not result in satisfaction, but only in the reduction of dissatisfaction (Maroudas et al., 2008).'],
['','Employees also have intrinsic motivation needs or motivators, which include such factors as achievement and recognition. Unlike extrinsic factors, motivator factors may ideally result in job satisfaction (Maroudas et al., 2008). Herzberg’s (1966) theory discusses the need for a ‘balance’ of these two types of needs.'],
['','The impact of fun as a motivating factor at work has also been explored. For example, Tews, Michel and Stafford (2013) conducted a study focusing on staff from a chain of themed restaurants in the United States. It was found that fun activities had a favorable impact on performance and manager support for fun had a favorable impact in reducing turnover. Their findings support the view that fun may indeed have a beneficial effect, but the framing of that fun must be carefully aligned with both organizational goals and employee characteristics. ‘Managers must learn how to achieve the delicate balance of allowing employees the freedom to enjoy themselves at work while simultaneously maintaining high levels of performance’ (Tews et al., 2013).'],
['','Deery (2008) has recommended several actions that can be adopted at the organizational level to retain good staff as well as assist in balancing work and family life. Those particularly appropriate to the hospitality industry include allowing adequate breaks during the working day, staff functions that involve families, and providing health and well-being opportunities.']
],

t2:{id:'t2',name:'Đề 2',parts:[
{n:1,range:[1,13],title:'How baby talk gives infant brains a boost',sub:'',
paras:[
['A','The typical way of talking to a baby – high-pitched, exaggerated and repetitious – is a source of fascination for linguists who hope to understand how ‘baby talk’ impacts on learning. Most babies start developing their hearing while still in the womb, prompting some hopeful parents to play classical music to their pregnant bellies. Some research even suggests that infants are listening to adult speech as early as 10 weeks before being born, gathering the basic building blocks of their family’s native tongue.'],
['B','Early language exposure seems to have benefits to the brain – for instance, studies suggest that babies raised in bilingual homes are better at learning how to mentally prioritize information. So how does the sweet if sometimes absurd sound of infant-directed speech influence a baby’s development? Here are some recent studies that explore the science behind baby talk.'],
['C','Fathers don’t use baby talk as often or in the same ways as mothers – and that’s perfectly OK, according to a new study. Mark VanDam of Washington State University at Spokane and colleagues equipped parents with recording devices and speech-recognition software to study the way they interacted with their youngsters during a normal day. ‘We found that moms do exactly what you’d expect and what’s been described many times over,’ VanDam explains. ‘But we found that dads aren’t doing the same thing. Dads didn’t raise their pitch or fundamental frequency when they talked to kids.’ Their role may be rooted in what is called the bridge hypothesis, which dates back to 1975. It suggests that fathers use less familial language to provide their children with a bridge to the kind of speech they’ll hear in public. ‘The idea is that a kid gets to practice a certain kind of speech with mom and another kind of speech with dad, so the kid then has a wider repertoire of kinds of speech to practice,’ says VanDam.'],
['D','Scientists from the University of Washington and the University of Connecticut collected thousands of 30-second conversations between parents and their babies, fitting 26 children with audio-recording vests that captured language and sound during a typical eight-hour day. The study found that the more baby talk parents used, the more their youngsters began to babble. And when researchers saw the same babies at age two, they found that frequent baby talk had dramatically boosted vocabulary, regardless of socioeconomic status. ‘Those children who listened to a lot of baby talk were talking more than the babies that listened to more adult talk or standard speech,’ says Nairán Ramírez-Esparza of the University of Connecticut. ‘We also found that it really matters whether you use baby talk in a one-on-one context,’ she adds. ‘The more parents use baby talk one-on-one, the more babies babble, and the more they babble, the more words they produce later in life.’'],
['E','Another study suggests that parents might want to pair their youngsters up so they can babble more with their own kind. Researchers from McGill University and Université du Québec à Montréal found that babies seem to like listening to each other rather than to adults – which may be why baby talk is such a universal tool among parents. They played repeating vowel sounds made by a special synthesizing device that mimicked sounds made by either an adult woman or another baby. This way, only the impact of the auditory cues was observed. The team then measured how long each type of sound held the infants’ attention. They found that the ‘infant’ sounds held babies’ attention nearly 40 percent longer. The baby noises also induced more reactions in the listening infants, like smiling or lip moving, which approximates sound making. The team theorizes that this attraction to other infant sounds could help launch the learning process that leads to speech. ‘It may be some property of the sound that is just drawing their attention,’ says study co-author Linda Polka. ‘Or maybe they are really interested in that particular type of sound because they are starting to focus on their own ability to make sounds. We are speculating here but it might catch their attention because they recognize it as a sound they could possibly make.’'],
['F','In a study published in <i>Proceedings of the National Academy of Sciences</i>, a total of 57 babies from two slightly different age groups – seven months and eleven and a half months – were played a number of syllables from both their native language (English) and a non-native tongue (Spanish). The infants were placed in a brain-activation scanner that recorded activity in a brain region known to guide the motor movements that produce speech. The results suggest that listening to baby talk prompts infant brains to start practicing their language skills. ‘Finding activation in motor areas of the brain when infants are simply listening is significant, because it means the baby brain is engaged in trying to talk back right from the start, and suggests that seven-month-olds’ brains are already trying to figure out how to make the right movements that will produce words,’ says co-author Patricia Kuhl. Another interesting finding was that while the seven-month-olds responded to all speech sounds regardless of language, the brains of the older infants worked harder at the motor activations of non-native sounds compared to native sounds. The study may have also uncovered a process by which babies recognize differences between their native language and other tongues.']
],

{n:2,range:[14,26],title:'Saving bugs to find new drugs',sub:'Zoologist Ross Piper looks at the potential of insects in pharmaceutical research',
paras:[
['A','More drugs than you might think are derived from, or inspired by, compounds found in living things. Looking to nature for the soothing and curing of our ailments is nothing new – we have been doing it for tens of thousands of years. You only have to look at other primates – such as the capuchin monkeys who rub themselves with toxin-oozing millipedes to deter mosquitoes, or the chimpanzees who use noxious forest plants to rid themselves of intestinal parasites – to realise that our ancient ancestors too probably had a basic grasp of medicine.'],
['B','Pharmaceutical science and chemistry built on these ancient foundations and perfected the extraction, characterization, modification and testing of these natural products. Then, for a while, modern pharmaceutical science moved its focus away from nature and into the laboratory, designing chemical compounds from scratch. The main cause of this shift is that although there are plenty of promising chemical compounds in nature, finding them is far from easy. Securing sufficient numbers of the organism in question, isolating and characterizing the compounds of interest, and producing large quantities of these compounds are all significant hurdles.'],
['C','Laboratory-based drug discovery has achieved varying levels of success, something which has now prompted the development of new approaches focusing once again on natural products. With the ability to mine genomes for useful compounds, it is now evident that we have barely scratched the surface of nature’s molecular diversity. This realization, together with several looming health crises, such as antibiotic resistance, has put bioprospecting – the search for useful compounds in nature – firmly back on the map.'],
['D','Insects are the undisputed masters of the terrestrial domain, where they occupy every possible niche. Consequently, they have a bewildering array of interactions with other organisms, something which has driven the evolution of an enormous range of very interesting compounds for defensive and offensive purposes. Their remarkable diversity exceeds that of every other group of animals on the planet combined. Yet even though insects are far and away the most diverse animals in existence, their potential as sources of therapeutic compounds is yet to be realised.'],
['E','From the tiny proportion of insects that have been investigated, several promising compounds have been identified. For example, alloferon, an antimicrobial compound produced by blow fly larvae, is used as an antiviral and antitumor agent in South Korea and Russia. The larvae of a few other insect species are being investigated for the potent antimicrobial compounds they produce. Meanwhile, a compound from the venom of the wasp <i>Polybia paulista</i> has potential in cancer treatment.'],
['F','Why is it that insects have received relatively little attention in bioprospecting? Firstly, there are so many insects that, without some manner of targeted approach, investigating this huge variety of species is a daunting task. Secondly, insects are generally very small, and the glands inside them that secrete potentially useful compounds are smaller still. This can make it difficult to obtain sufficient quantities of the compound for subsequent testing. Thirdly, although we consider insects to be everywhere, the reality of this ubiquity is vast numbers of a few extremely common species. Many insect species are infrequently encountered and very difficult to rear in captivity, which, again, can leave us with insufficient material to work with.'],
['G','My colleagues and I at Aberystwyth University in the UK have developed an approach in which we use our knowledge of ecology as a guide to target our efforts. The creatures that particularly interest us are the many insects that secrete powerful poison for subduing prey and keeping it fresh for future consumption. There are even more insects that are masters of exploiting filthy habitats, such as faeces and carcasses, where they are regularly challenged by thousands of micro-organisms. These insects have many antimicrobial compounds for dealing with pathogenic bacteria and fungi, suggesting that there is certainly potential to find many compounds that can serve as or inspire new antibiotics.'],
['H','Although natural history knowledge points us in the right direction, it doesn’t solve the problems associated with obtaining useful compounds from insects. Fortunately, it is now possible to snip out the stretches of the insect’s DNA that carry the codes for the interesting compounds and insert them into cell lines that allow larger quantities to be produced. And although the road from isolating and characterizing compounds with desirable qualities to developing a commercial product is very long and full of pitfalls, the variety of successful animal-derived pharmaceuticals on the market demonstrates there is a precedent here that is worth exploring.'],
['I','With every bit of wilderness that disappears, we deprive ourselves of potential medicines. As much as I’d love to help develop a groundbreaking insect-derived medicine, my main motivation for looking at insects in this way is conservation. I sincerely believe that all species, however small and seemingly insignificant, have a right to exist for their own sake. If we can shine a light on the darker recesses of nature’s medicine cabinet, exploring the useful chemistry of the most diverse animals on the planet, I believe we can make people think differently about the value of nature.']
],

{kind:'gaps',type:'Summary completion',range:[23,26],instr:'Complete the summary below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.',title:'Research at Aberystwyth University',text:'Ross Piper and fellow zoologists at Aberystwyth University are using their expertise in {23} when undertaking bioprospecting with insects. They are especially interested in the compounds that insects produce to overpower and preserve their {24}. They are also interested in compounds which insects use to protect themselves from pathogenic bacteria and fungi found in their {25}. Piper hopes that these substances will be useful in the development of drugs such as {26}.'}

{n:3,range:[27,40],title:'Why companies should welcome disorder',sub:'',
paras:[
['A','Organisation is big business. Whether it is of our lives – all those inboxes and calendars – or how companies are structured, a multi-billion dollar industry helps to meet this need.<br><br>We have more strategies for time management, project management and self-organisation than at any other time in human history. We are told that we ought to organize our company, our home life, our week, our day and even our sleep, all as a means to becoming more productive. Every week, countless seminars and workshops take place around the world to tell a paying public that they ought to structure their lives in order to achieve this.<br><br>This rhetoric has also crept into the thinking of business leaders and entrepreneurs, much to the delight of self-proclaimed perfectionists with the need to get everything right. The number of business schools and graduates has massively increased over the past 50 years, essentially teaching people how to organise well.'],
['B','Ironically, however, the number of businesses that fail has also steadily increased. Work-related stress has increased. A large proportion of workers from all demographics claim to be dissatisfied with the way their work is structured and the way they are managed.<br><br>This begs the question: what has gone wrong? Why is it that on paper the drive for organisation seems a sure shot for increasing productivity, but in reality falls well short of what is expected?'],
['C','This has been a problem for a while now. Frederick Taylor was one of the forefathers of scientific management. Writing in the first half of the 20th century, he designed a number of principles to improve the efficiency of the work process, which have since become widespread in modern companies. So the approach has been around for a while.'],
['D','New research suggests that this obsession with efficiency is misguided. The problem is not necessarily the management theories or strategies we use to organise our work; it’s the basic assumptions we hold in approaching how we work. Here it’s the assumption that order is a necessary condition for productivity. This assumption has also fostered the idea that disorder must be detrimental to organisational productivity. The result is that businesses and people spend time and money organising themselves for the sake of organising, rather than actually looking at the end goal and usefulness of such an effort.'],
['E','What’s more, recent studies show that order actually has diminishing returns. Order does increase productivity to a certain extent, but eventually the usefulness of the process of organisation, and the benefit it yields, reduce until the point where any further increase in order reduces productivity. Some argue that in a business, if the cost of formally structuring something outweighs the benefit of doing it, then that thing ought not to be formally structured. Instead, the resources involved can be better used elsewhere.'],
['F','In fact, research shows that, when innovating, the best approach is to create an environment devoid of structure and hierarchy and enable everyone involved to engage as one organic group. These environments can lead to new solutions that, under conventionally structured environments (filled with bottlenecks in terms of information flow, power structures, rules, and routines) would never be reached.'],
['G','In recent times companies have slowly started to embrace this disorganisation. Many of them embrace it in terms of perception (embracing the idea of disorder, as opposed to fearing it) and in terms of process (putting mechanisms in place to reduce structure).<br><br>For example, Oticon, a large Danish manufacturer of hearing aids, used what it called a ‘spaghetti’ structure in order to reduce the organisation’s rigid hierarchies. This involved scrapping formal job titles and giving staff huge amounts of ownership over their own time and projects. This approach proved to be highly successful initially, with clear improvements in worker productivity in all facets of the business.<br><br>In similar fashion, the former chairman of General Electric embraced disorganisation, putting forward the idea of the ‘boundaryless’ organisation. Again, it involves breaking down the barriers between different parts of a company and encouraging virtual collaboration and flexible working. Google and a number of other tech companies have embraced (at least in part) these kinds of flexible structures, facilitated by technology and strong company values which glue people together.'],
['H','A word of warning to others thinking of jumping on this bandwagon: the evidence so far suggests disorder, much like order, also seems to have diminishing utility, and can also have detrimental effects on performance if overused. Like order, disorder should be embraced only so far as it is useful. But we should not fear it – nor venerate one over the other. This research also shows that we should continually question whether or not our existing assumptions work.']
],

(async function boot(){
  const fallback=setTimeout(()=>{if(!db)notice('Chưa kết nối được','Trang chưa kết nối được với hệ thống lưu bài. Em hãy mở trang này trong Claude khi đã đăng nhập, rồi tải lại trang.')},11000);
  if(!window.claude||!window.claude.use){clearTimeout(fallback);notice('Chưa kết nối được','Trang cần được mở trong Claude khi em đã đăng nhập thì mới lưu được bài làm.');return}
  [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  clearTimeout(fallback);
  if(!db||!user){notice('Em cần đăng nhập','Hãy đăng nhập tài khoản Claude mà cô đã mời, rồi mở lại đường link bài kiểm tra.');return}
  uid=await user.id();
  try{isTeacher=!!(await user.canEdit())}catch(e){isTeacher=false}
  if(!uid){notice('Em cần đăng nhập','Hãy đăng nhập tài khoản Claude mà cô đã mời, rồi mở lại đường link bài kiểm tra.');return}
  window.addEventListener('hashchange',route);
  route();
})();
function route(){
  if(location.hash==='#giao-vien'){isTeacher?teacher():notice('Trang dành cho giáo viên','Trang tổng hợp kết quả chỉ mở được bằng tài khoản giáo viên.','<a class="btn ghost" href="#">Về trang làm bài</a>')}
  else{stopTeacher();student()}
}

let S=null; // exam state
async function student(){
  let snap;
  try{snap=await db.doc('submissions/'+uid).get()}catch(e){notice('Chưa kết nối được','Hệ thống lưu bài đang bận. Em đợi một chút rồi tải lại trang nhé.');return}
  const d=snap.exists?snap.data():null;
  if(d&&d.status==='submitted')return doneScreen(d);
  if(d&&d.status==='in_progress'&&TESTS[d.testId]){
    const local=lsGet('pt2-'+uid);
    let answers={...(d.answers||{})};
    if(local&&local.testId===d.testId&&(local.at||0)>(d.updatedAt||0))answers={...answers,...local.answers};
    if(Date.now()>=d.startedAt+TOTAL_MS){S={...d,answers};return submit(true)}
    return startExam({...d,answers});
  }
  startScreen();
}

function confirmDlg(title,html,okLabel,onOk,cancelLabel='Quay lại'){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">${title}</h3>${html}<div class="acts"><button class="btn ghost" type="button" data-x>${cancelLabel}</button><button class="btn pink" type="button" data-ok>${okLabel}</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('[data-x]').onclick=close;
  m.addEventListener('click',e=>{if(e.target===m)close()});
  const ok=m.querySelector('[data-ok]');ok.focus();
  ok.onclick=async()=>{ok.disabled=true;const r=await onOk();if(r===false){ok.disabled=false;return}close()};
}

/* ---------- exam rendering ---------- */
function renderPassage(p){
  return `<article class="passage" data-part="${p.n-1}" ${p.n>1?'hidden':''}>
  <div class="eyebrow">Reading Passage ${p.n}</div>
  <h2 class="ptitle">${p.title}</h2>${p.sub?`<p class="psub">${p.sub}</p>`:''}
  ${p.paras.map(([l,t])=>`<div class="para ${l?'':'nolab'}">${l?`<span class="pl">${l}</span>`:''}<p>${t}</p></div>`).join('')}
  </article>`;
}
function selOpts(g){return g.box?g.box.items.map(x=>x[0]):g.opts.map(x=>x[0])}
function renderGroup(g,tid){
  const [a,b]=g.range;
  const head=`<h4>Questions ${a}${b>a?'–'+b:''}</h4><p class="instr">${g.instr}</p>`;
  if(g.kind==='select'){
    const opts=selOpts(g);
    const box=g.box?`<div class="box"><div class="bt">${g.box.title}</div>${g.box.items.map(([k,v])=>`<div class="it"><b>${k}</b><span>${v}</span></div>`).join('')}</div>`:'';
    return `<section class="group">${head}${box}${g.items.map(([q,txt])=>`<div class="q inline" id="q-${q}" data-qw="${q}"><span class="qn">${q}</span><span class="stem">${txt}</span><select data-q="${q}" aria-label="Câu ${q}"><option value="">—</option>${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`).join('')}</section>`;
  }
  if(g.kind==='radio'){
    return `<section class="group">${head}${g.items.map(([q,txt])=>`<div class="q" id="q-${q}" data-qw="${q}"><span class="qn">${q}</span><div><p class="stem">${txt}</p><div class="radios" role="radiogroup" aria-label="Câu ${q}">${g.opts.map(o=>`<label><input type="radio" name="r${q}" value="${o}" data-q="${q}">${o}</label>`).join('')}</div></div></div>`).join('')}</section>`;
  }
  if(g.kind==='multi'){
    return `<section class="group">${head}<div class="q" id="q-${a}" data-qw="${a}" data-qw2="${b}"><span class="qn" id="q-${b}">${a}</span><div><div class="multihead"><span class="stem" style="margin:0"><b>Questions ${a} and ${b}.</b> ${g.stem}</span></div><div class="checks" style="margin-top:8px">${g.opts.map(([k,v])=>`<label><input type="checkbox" value="${k}" data-multi="${a}-${b}"><b>${k}</b><span>${v}</span></label>`).join('')}</div></div></div></section>`;
  }
  const gap=q=>`<span class="gap" id="q-${q}" data-qw="${q}"><span class="gn">${q}</span><input type="text" data-q="${q}" aria-label="Câu ${q}" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`;
  if(g.kind==='gaps'){
    return `<section class="group">${head}<div class="summary"><span class="st">${g.title}</span>${g.text.replace(/\{(\d+)\}/g,(_,q)=>gap(q))}</div></section>`;
  }
  if(g.kind==='sent'){
    return `<section class="group">${head}${g.items.map(([q,txt])=>`<p class="sentq" style="margin:0">${txt.replace(/\{(\d+)\}/g,(_,x)=>gap(x))}</p>`).join('')}</section>`;
  }
}
function renderQuestions(p,tid){
  return `<div class="qset" data-part="${p.n-1}" ${p.n>1?'hidden':''}><div class="qhead"><h3>Part ${p.n}</h3><span class="muted" style="font-size:13px">Questions ${p.range[0]}–${p.range[1]}</span></div>${p.groups.map(g=>renderGroup(g,tid)).join('')}</div>`;
}
function startExam(d){
  stopExam();
  S={...d,answers:{...(d.answers||{})},part:0,dirty:false,saving:false,saveT:null,tick:null,submitting:false,cur:null};

  <header class="xbar">${bannerHTML(40)}<div class="xinfo"><b><span class="long">Progress Test 2 · Reading · </span>${t.name}</b><small>${esc(d.name)} · IELTS Vững Bước</small></div>

    <button class="btn pink" id="submitBtn" type="button">Nộp bài</button></header>
  <div class="mtabs" id="mtabs"><button type="button" data-v="p" aria-pressed="true">Bài đọc</button><button type="button" data-v="q" aria-pressed="false">Câu hỏi</button></div>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Kéo để đổi độ rộng hai cột" tabindex="0"></div>

function onAnswer(e){

function setSave(t){const s=$('#savest');if(s)s.textContent=t}

async function doSave(){

  catch(e){S.dirty=true;setSave('Chưa lưu được – đang thử lại');S.saveT=setTimeout(doSave,5000)}

function askSubmit(){

}
async function submit(auto){
  if(!S||S.submitting)return;

  const end=Math.min(now,S.startedAt+TOTAL_MS);

    catch(e){await new Promise(r=>setTimeout(r,1500+Math.random()*1000))}

/* ---------- highlighter ---------- */
const tool=$('#hltool');let hlTarget=null;
function zoneOf(n){n=n&&(n.nodeType===1?n:n.parentNode);return n&&n.closest&&n.closest('.hlz')}
function showTool(rect,canAdd,canDel){
  $('#hl-add').hidden=!canAdd;$('#hl-del').hidden=!canDel;
  tool.hidden=false;
  const w=tool.offsetWidth,h=tool.offsetHeight;
  let x=rect.left+rect.width/2-w/2, y=rect.top-h-8;
  if(y<8)y=rect.bottom+8;
  x=Math.max(8,Math.min(innerWidth-w-8,x));
  tool.style.left=x+'px';tool.style.top=y+'px';
}
function checkSel(){
  if(!document.body.classList.contains('exam-mode'))return;
  const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){tool.hidden=true;return}
  const sel=getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed){if(!hlTarget)tool.hidden=true;return}
  const r=sel.getRangeAt(0);
  if(!zoneOf(r.startContainer)||zoneOf(r.startContainer)!==zoneOf(r.endContainer)){tool.hidden=true;return}
  hlTarget=null;
  const hasMark=$$('mark.hl',zoneOf(r.commonAncestorContainer)).some(m=>r.intersectsNode(m));
  showTool(r.getBoundingClientRect(),true,hasMark);
}
let selT;document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(checkSel,180)});
document.addEventListener('mouseup',()=>setTimeout(checkSel,10));
document.addEventListener('click',e=>{
  if(tool.contains(e.target))return;
  const m=e.target.closest&&e.target.closest('mark.hl');
  const sel=getSelection();
  if(m&&sel&&sel.isCollapsed){hlTarget=m;showTool(m.getBoundingClientRect(),false,true);return}
  if(sel&&sel.isCollapsed){hlTarget=null;tool.hidden=true}
});
tool.addEventListener('pointerdown',e=>e.preventDefault());
$('#hl-add').onclick=()=>{const sel=getSelection();if(!sel.rangeCount)return;wrapRange(sel.getRangeAt(0));sel.removeAllRanges();tool.hidden=true};
$('#hl-del').onclick=()=>{
  let marks=[];
  if(hlTarget)marks=[hlTarget];
  else{const sel=getSelection();if(sel.rangeCount){const r=sel.getRangeAt(0);marks=$$('mark.hl',zoneOf(r.commonAncestorContainer)||document).filter(m=>r.intersectsNode(m))}}
  marks.forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);m.remove();p.normalize()});
  hlTarget=null;getSelection().removeAllRanges();tool.hidden=true;
};
function wrapRange(range){
  const root=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentNode;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!range.intersectsNode(n)||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    if(n.parentNode.closest('mark.hl,select,option,button,label .qn,.qn,.gn'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT}});
  const jobs=[];while(tw.nextNode()){const n=tw.currentNode;
    let s=0,e=n.nodeValue.length;
    if(n===range.startContainer)s=range.startOffset;
    if(n===range.endContainer)e=range.endOffset;
    if(s<e)jobs.push([n,s,e])}
  jobs.forEach(([n,s,e])=>{let t=n;if(s>0)t=t.splitText(s);if(e-s<t.nodeValue.length)t.splitText(e-s);
    const m=document.createElement('mark');m.className='hl';t.parentNode.insertBefore(m,t);m.appendChild(t)});
}

let T=null;
function stopTeacher(){if(T){T.unsubs.forEach(u=>{try{u()}catch(e){}});T=null}}
const norm=s=>String(s??'').toLowerCase().normalize('NFKC').replace(/[’‘`]/g,"'").replace(/[-–—_/]/g,' ').replace(/[.,;:!?"()]/g,'').replace(/\s+/g,' ').trim().replace(/^(the|a|an) /,'');
function grade(sub,key,ov){
  const tid=sub.testId,ans=sub.answers||{},K=key.answers||{};ov=ov||{};
  const per={};
  const pairs=key.pairs||[];const inPair={};pairs.forEach(p=>{inPair[p[0]]=p;inPair[p[1]]=p});
  for(let q=1;q<=40;q++){
    const given=String(ans[q]??'').trim();const accepted=(K[q]||[]).map(String);
    let ok;
    if(inPair[q]){
      const[a,b]=inPair[q];const Kset=new Set([...(K[a]||[]),...(K[b]||[])].map(x=>x.toUpperCase()));
      const Sset=[...new Set([ans[a],ans[b]].filter(Boolean).map(x=>String(x).toUpperCase()))];
      const hits=Sset.filter(x=>Kset.has(x)).length;
      ok=q===a?hits>=1:hits>=2;
      per[q]={given,key:[...Kset].sort().join(' & '),ok};
    }else{
      const kind=QMAP[tid][q].kind;
      if(kind==='gaps'||kind==='sent')ok=given!==''&&accepted.some(a=>norm(a)===norm(given));
      else ok=given!==''&&accepted.some(a=>a.toUpperCase()===given.toUpperCase());
      per[q]={given,key:accepted.join(' / '),ok};
    }
    per[q].auto=per[q].ok;
    if(typeof ov[q]==='boolean')per[q].ok=ov[q];
  }
  const parts=[0,0,0],ptot=[0,0,0],types={};
  for(let q=1;q<=40;q++){const m=QMAP[tid][q];ptot[m.part]++;if(per[q].ok)parts[m.part]++;
    const ty=types[m.type]||(types[m.type]={c:0,t:0});ty.t++;if(per[q].ok)ty.c++}
  const total=parts.reduce((a,b)=>a+b,0);
  return{per,parts,ptot,types,total,band:band(total)};
}

  Promise.all(['t1','t2'].map(id=>db.doc('keys/'+id).get().then(s=>{if(s.exists)T.keys[id]=s.data();else T.keyErr=true}))).catch(()=>{T.keyErr=true}).finally(()=>renderTeacher());

  T.unsubs.push(db.collection('submissions').onSnapshot(s=>{if(!T)return;if(!s.metadata.fromCache){T.loaded=true;clearTimeout(lt)}T.subs=s.docs.map(d=>({id:d.id,...d.data()}));renderTeacher()},e=>{if(T){T.loaded=true;$('#tgrid').innerHTML='<div class="empty">Không đọc được kết quả ('+esc(e.code)+').</div>'}}));
  T.unsubs.push(db.collection('reviews').onSnapshot(s=>{if(!T)return;T.reviews={};s.docs.forEach(d=>T.reviews[d.id]=d.data());renderTeacher();if(T.open)refreshSheet()},()=>{}));

function analysisPanel(tid,rows){
  const t=TESTS[tid];
  if(!rows.length)return `<section class="panel"><div class="phead"><h2>Phân tích câu hỏi · ${t.name}</h2></div><div class="empty">Chưa có bài nộp cho ${t.name}.</div></section>`;
  const rate=q=>rows.filter(r=>r.g.per[q].ok).length/rows.length;
  const types={};rows.forEach(r=>{for(const[k,v]of Object.entries(r.g.types)){const x=types[k]||(types[k]={c:0,t:0});x.c+=v.c;x.t+=v.t}});
  const pavg=[0,1,2].map(i=>rows.reduce((a,r)=>a+r.g.parts[i],0)/rows.length);
  const hard=Array.from({length:40},(_,i)=>i+1).sort((a,b)=>rate(a)-rate(b)).slice(0,5);
  return `<section class="panel"><div class="phead"><h2>Phân tích câu hỏi · ${t.name}</h2><span class="muted" style="font-size:13px">${rows.length} bài đã nộp</span></div>
  <div class="heat" aria-label="Tỉ lệ đúng từng câu">${Array.from({length:40},(_,i)=>i+1).map(q=>{const r=rate(q);return `<div class="${r<.4?'h0':r<.7?'h1':'h2'}" title="Câu ${q}: ${Math.round(r*100)}% đúng">${q}</div>`}).join('')}</div>
  <div class="hlegend"><span><i style="background:var(--bad-soft)"></i>Dưới 40% đúng</span><span><i style="background:var(--accent-soft)"></i>40–69%</span><span><i style="background:var(--ok-soft)"></i>Từ 70%</span><span>Câu khó nhất: <b>${hard.map(q=>q+' ('+Math.round(rate(q)*100)+'%)').join(', ')}</b></span></div>
  <div class="two"><div class="bars"><b style="font-size:13.5px">Theo dạng câu hỏi</b>${Object.entries(types).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t).map(([k,v])=>`<div class="bar"><span>${k}</span><span class="tr"><i style="width:${v.c/v.t*100}%"></i></span><b>${Math.round(v.c/v.t*100)}%</b></div>`).join('')}</div>
  <div class="bars"><b style="font-size:13.5px">Theo bài đọc (điểm trung bình)</b>${t.parts.map((p,i)=>{const n=p.range[1]-p.range[0]+1;return `<div class="bar"><span>Passage ${p.n}</span><span class="tr"><i style="width:${pavg[i]/n*100}%"></i></span><b>${pavg[i].toFixed(1)}/${n}</b></div>`}).join('')}</div></div>
  </section>`;
}
async function copyScores(rows){
  const lines=[['Học sinh','Đề','P1','P2','P3','Tổng','Band','Thời gian','Nhận xét'].join('\t')];
  rows.filter(r=>r.g).forEach(r=>lines.push([r.name,TESTS[r.testId].name,...r.g.parts,r.g.total,fmtBand(r.g.band),fmtDur(r.durationSec),(r.rv.comment||'').replace(/\s+/g,' ')].join('\t')));
  const txt=lines.join('\n');
  try{await navigator.clipboard.writeText(txt);toast('Đã sao chép – dán vào Excel/Google Sheets')}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.className='cm';ta.style.cssText='position:fixed;inset:20% 10%;z-index:80;height:50%;width:80%';document.body.appendChild(ta);ta.select();toast('Bấm Ctrl/Cmd+C để sao chép, rồi bấm ra ngoài để đóng');ta.onblur=()=>ta.remove()}
}
function openSheet(id){T.open=id;refreshSheet(true)}
function closeSheet(){T.open=null;const s=$('#sheet');if(s)s.remove()}
function refreshSheet(first){
  const r=gradedRows().find(x=>x.id===T.open);
  let sh=$('#sheet');
  if(!r){closeSheet();return}
  const draft=sh?$('#cm',sh)?.value:null;
  const t=TESTS[r.testId],g=r.g;
  const html=`<div class="in" role="dialog" aria-modal="true" aria-labelledby="shn">
   <div class="shd"><div><div class="eyebrow">${t.name} · ${r.status==='submitted'?'Nộp lúc '+fmtTime(r.submittedAt)+(r.auto?' (tự nộp khi hết giờ)':''):'Đang làm bài'}</div><h2 id="shn">${esc(r.name)}</h2></div><button class="btn ghost sm" type="button" id="shx">Đóng</button></div>
   ${g?`<div class="scorebox"><div class="big">${g.total}<small>/40</small></div><div style="display:grid;gap:6px"><span><span class="bandpill">Band ${fmtBand(g.band)}</span></span><div class="row">${g.parts.map((p,i)=>`<span>Passage ${i+1}: <b>${p}/${g.ptot[i]}</b></span>`).join('')}<span>Thời gian: <b>${fmtDur(r.durationSec)}</b></span></div></div></div>
   <section class="panel"><h2>Theo dạng câu hỏi</h2><div class="bars">${Object.entries(g.types).map(([k,v])=>`<div class="bar"><span>${k}</span><span class="tr"><i style="width:${v.c/v.t*100}%"></i></span><b>${v.c}/${v.t}</b></div>`).join('')}</div></section>
   <section class="panel"><div class="phead"><h2>Nhận xét kỹ năng đọc</h2><span class="wc" id="wc"></span></div>
    <textarea class="cm" id="cm" placeholder="Nhận xét ngắn gọn (dưới 100 từ): điểm mạnh, dạng bài cần luyện thêm, định hướng tiếp theo…"></textarea>
    <div class="racts"><span class="hint">${r.rv.updatedAt?'Đã lưu lúc '+fmtTime(r.rv.updatedAt):'Chưa lưu nhận xét'}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" type="button" id="sug">Gợi ý nhận xét</button><button class="btn sm" type="button" id="savecm">Lưu nhận xét</button></div></div>
   </section>
   <section class="panel"><div class="phead"><h2>Bài làm chi tiết</h2><span class="hint">Câu điền từ có thể chấm lại thủ công</span></div>
    <div class="tbl"><table class="atbl"><thead><tr><th>Câu</th><th>Dạng</th><th>Học sinh</th><th>Đáp án</th><th></th><th></th></tr></thead><tbody>
    ${t.parts.map((p,pi)=>`<tr class="sep"><td colspan="6">Passage ${p.n} · ${esc(p.title)}</td></tr>`+Array.from({length:p.range[1]-p.range[0]+1},(_,k)=>p.range[0]+k).map(q=>{const x=g.per[q],m=QMAP[r.testId][q];const txt=m.kind==='gaps'||m.kind==='sent';const ov=typeof (r.rv.overrides||{})[q]==='boolean';
      return `<tr><td><b>${q}</b></td><td class="muted" style="font-size:12.5px">${m.type}</td><td class="ans">${x.given?esc(x.given):'<span class="muted">(bỏ trống)</span>'}</td><td class="ans">${esc(x.key)}</td><td class="${x.ok?'ok':'no'}">${x.ok?'✓':'✗'}</td><td>${txt&&x.given?`<button class="ovr ${ov?'on':''}" type="button" data-ov="${q}" data-to="${!x.ok}">${ov?'Bỏ chấm tay':(x.ok?'Chấm sai':'Chấm đúng')}</button>`:''}</td></tr>`}).join('')).join('')}
    </tbody></table></div></section>`:`<section class="panel"><p style="margin:0">Học sinh đang làm bài. Đã làm <b>${Object.values(r.answers||{}).filter(Boolean).length}/40</b> câu, còn <b>${fmtClock(r.startedAt+TOTAL_MS-Date.now())}</b>.</p></section>`}
   <section class="panel"><div class="phead"><h2>Cho làm lại</h2></div><p class="muted" style="margin:0;font-size:13.5px">Xoá bài làm này để học sinh chọn đề và làm lại từ đầu. Điểm và nhận xét hiện tại sẽ mất.</p><div><button class="btn ghost sm danger" type="button" id="reset">Xoá bài làm</button></div></section>
  </div>`;
  if(!sh){sh=document.createElement('div');sh.className='sheet';sh.id='sheet';document.body.appendChild(sh);sh.addEventListener('click',e=>{if(e.target===sh)closeSheet()})}
  sh.innerHTML=html;
  $('#shx',sh).onclick=closeSheet;
  const cm=$('#cm',sh);
  if(cm){
    cm.value=draft!=null&&!first?draft:(r.rv.comment||'');
    const upd=()=>{const n=words(cm.value);const w=$('#wc',sh);w.textContent=n+'/100 từ';w.classList.toggle('over',n>100);$('#savecm',sh).disabled=n>100};
    cm.oninput=upd;upd();
    $('#savecm',sh).onclick=async e=>{const b=e.target;b.disabled=true;try{await db.doc('reviews/'+r.id).set({...r.rv,comment:cm.value.trim(),name:r.name,updatedAt:Date.now()});toast('Đã lưu nhận xét')}catch(err){toast('Chưa lưu được, thử lại sau')}b.disabled=false};
    $('#sug',sh).onclick=()=>suggest(r,cm,$('#sug',sh));
    $$('[data-ov]',sh).forEach(b=>b.onclick=async()=>{const q=b.dataset.ov;const ovr={...(r.rv.overrides||{})};if(typeof ovr[q]==='boolean')delete ovr[q];else ovr[q]=b.dataset.to==='true';
      b.disabled=true;try{await db.doc('reviews/'+r.id).set({...r.rv,overrides:ovr,name:r.name,updatedAt:r.rv.updatedAt||null})}catch(e){toast('Chưa lưu được');b.disabled=false}});
  }
  $('#reset',sh).onclick=()=>confirmDlg('Xoá bài làm?',`<p>Bài làm${g?' và nhận xét':''} của <b>${esc(r.name)}</b> sẽ bị xoá. Học sinh có thể bắt đầu lại.</p>`,'Xoá',async()=>{try{await db.doc('submissions/'+r.id).delete();await db.doc('reviews/'+r.id).delete();closeSheet();toast('Đã xoá bài làm')}catch(e){toast('Chưa xoá được');return false}});
  if(first)$('#shx',sh).focus();
}
async function suggest(r,cm,btn){
  const sample=await claude.use('sample');
  if(!sample){toast('Tính năng gợi ý chưa dùng được ở đây');return}
  const g=r.g,t=TESTS[r.testId];
  const types=Object.entries(g.types).map(([k,v])=>`${k}: ${v.c}/${v.t}`).join('; ');
  const wrong=Object.entries(g.per).filter(([q,x])=>!x.ok).map(([q,x])=>`Q${q} (${QMAP[r.testId][q].type}) HS: "${x.given||'bỏ trống'}", đáp án: ${x.key}`).slice(0,25).join('\n');
  const prompt=`Bạn là giáo viên IELTS của lớp "IELTS Vững Bước" (học sinh mục tiêu band 5.0–6.0). Viết MỘT đoạn nhận xét bằng tiếng Việt, dưới 90 từ, gửi trực tiếp cho học sinh (xưng "cô", gọi "em"), về kỹ năng Reading trong bài Progress Test 2. Gồm: 1 điểm mạnh cụ thể, 1–2 dạng câu hỏi cần cải thiện kèm nguyên nhân có thể (dựa vào lỗi), và 1 định hướng luyện tập cụ thể cho tuần tới. Giọng ấm áp, rõ ràng, không dùng gạch đầu dòng, không nhắc lại toàn bộ số liệu. Chỉ trả về đoạn nhận xét.

Học sinh: ${r.name}
Đề: ${t.name}. Tổng: ${g.total}/40 (band ${fmtBand(g.band)}). Passage 1: ${g.parts[0]}/${g.ptot[0]}, Passage 2: ${g.parts[1]}/${g.ptot[1]}, Passage 3: ${g.parts[2]}/${g.ptot[2]}. Thời gian làm: ${fmtDur(r.durationSec)}.
Theo dạng: ${types}
Các câu sai:
${wrong||'không có'}`;
  const old=btn.textContent;btn.disabled=true;btn.textContent='Đang viết…';
  try{const res=await sample(prompt,{modelTier:'default',onText:({text})=>{cm.value=text;cm.dispatchEvent(new Event('input'))}});cm.value=res.text.trim();cm.dispatchEvent(new Event('input'))}
  catch(e){toast(e&&e.code==='rate_limited'?'Đang quá tải, thử lại sau ít phút':'Chưa tạo được gợi ý')}
  btn.disabled=false;btn.textContent=old;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('.modal');if(m)m.remove();else if($('#sheet'))closeSheet()}});
setInterval(()=>{if(T&&T.subs.some(s=>s.status==='in_progress')&&!$('#sheet'))renderTeacher()},30000);
</script>
