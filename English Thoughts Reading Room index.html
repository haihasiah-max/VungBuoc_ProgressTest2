<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English Thoughts Reading Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: logo-led header, test list on paper; exam mode = fixed split screen (passage | questions) with a timer bar and question navigator */
:root{
  --bg:#FFFFFF; --paper:#FFF7F9; --blush:#FCE7EE; --pink:#F2A6BC; --rose:#D9435F; --rose-ink:#B8304C;
  --navy:#1E2A4F; --ink:#1E2A4F; --muted:#6A6681; --line:#EED8E0; --surface:#FFFFFF;
  --good:#1D8A5A; --good-bg:#E3F4EC; --bad:#C8333F; --bad-bg:#FBE4E6; --warn:#B86E00;
  --hl1:#FFE38A; --hl2:#F9BFD0; --hl3:#BFD9FF;
  --shadow:0 1px 2px rgba(30,42,79,.06),0 6px 24px rgba(30,42,79,.07);
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121933; --paper:#18203D; --blush:#2A2546; --pink:#F2A6BC; --rose:#F06A85; --rose-ink:#F58AA0;
  --navy:#E9ECF7; --ink:#EEEAF2; --muted:#A9A6C2; --line:#2F3860; --surface:#1A2343;
  --good:#5FD29B; --good-bg:#173A33; --bad:#FF8A93; --bad-bg:#43213A; --warn:#F2B451;
  --hl1:rgba(255,214,90,.42); --hl2:rgba(242,120,160,.45); --hl3:rgba(110,160,255,.42);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121933; --paper:#18203D; --blush:#2A2546; --pink:#F2A6BC; --rose:#F06A85; --rose-ink:#F58AA0;
  --navy:#E9ECF7; --ink:#EEEAF2; --muted:#A9A6C2; --line:#2F3860; --surface:#1A2343;
  --good:#5FD29B; --good-bg:#173A33; --bad:#FF8A93; --bad-bg:#43213A; --warn:#F2B451;
  --hl1:rgba(255,214,90,.42); --hl2:rgba(242,120,160,.45); --hl3:rgba(110,160,255,.42);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--navy);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pink)}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.primary:hover{background:var(--rose-ink);border-color:var(--rose-ink)}
.btn.navy{background:#1E2A4F;border-color:#1E2A4F;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.muted{color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--blush);color:var(--rose-ink);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.input:focus{border-color:var(--rose);outline:none}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- site header ---------- */
.site-head{border-bottom:1px solid var(--line);background:var(--bg)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:54px;width:auto;display:block}
:root[data-theme="dark"] .brand img{filter:brightness(1.15)}
.nav{display:flex;gap:6px}
.nav a{padding:8px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.nav a[aria-current="page"]{color:var(--rose);background:var(--blush)}

/* ---------- home ---------- */
.hero{background:var(--paper);border-bottom:1px solid var(--line);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-block:36px 28px}
.hero h1{font-size:clamp(30px,4.6vw,48px);font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--rose)}
.hero p{max-width:56ch;color:var(--muted);font-size:16px;margin:12px 0 0}
.hero-logo{justify-self:center;width:min(240px,100%);max-width:100%}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-size:14px;color:var(--navy);font-weight:600}
.facts span{display:flex;align-items:center;gap:7px}
.facts i{width:8px;height:8px;border-radius:50%;background:var(--rose);display:inline-block}
.swatches{display:inline-flex;gap:3px;vertical-align:middle}
.swatches b{width:12px;height:12px;border-radius:3px;display:inline-block}
.section{padding-block:28px}
.section h2{font-size:26px;margin-bottom:4px}
.student-card{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--blush);border:1.5px solid var(--pink);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.test-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.test-card .no{font-family:var(--f-display);font-size:14px;font-weight:700;color:var(--rose)}
.test-card h3{font-size:22px}
.test-card .meta{font-size:13px;color:var(--muted)}
.test-card .chips{display:flex;flex-wrap:wrap;gap:6px}
.test-card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.status{font-size:13px;font-weight:600;color:var(--muted)}
.status.done{color:var(--good)}
.coming{border-style:dashed;box-shadow:none;background:transparent;justify-content:center;align-items:flex-start;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px;counter-reset:s}
.step{border-top:3px solid var(--pink);padding-top:12px}
.step b{display:block;font-family:var(--f-display);font-size:18px;color:var(--navy)}
.step b::before{counter-increment:s;content:counter(s) ". ";color:var(--rose)}
.step p{margin:4px 0 0;color:var(--muted);font-size:14px}
.site-foot{border-top:1px solid var(--line);margin-top:24px}
.site-foot .wrap{padding-block:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}

/* ---------- exam mode ---------- */
body.exam{overflow:hidden}
.test-app{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.t-head{display:flex;align-items:center;gap:12px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--pink);background:var(--surface)}
.t-head img{height:38px;width:auto}
.t-title{min-width:0;flex:1;line-height:1.25}
.t-title b{display:block;font-family:var(--f-display);font-size:17px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-title small{color:var(--muted);font-size:12px}
.timer{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--navy);background:var(--blush);padding:5px 12px;border-radius:10px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer svg{width:18px;height:18px}
.timer.warn{color:var(--warn)}
.timer.crit{color:#fff;background:var(--rose);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.timer.crit{animation:none}}
.hl-legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.hl-legend b{width:14px;height:14px;border-radius:4px;display:inline-block}
.t-tabs{display:none;grid-row:2}
.t-head{grid-row:1}
.split{grid-row:3}
.t-foot{grid-row:4}
.split{--split:50%;display:grid;grid-template-columns:var(--split) 10px minmax(0,1fr);min-height:0}
.pane{position:relative;min-width:0;min-height:0}
.pane-scroll{position:absolute;inset:0;overflow:auto;z-index:1;-webkit-overflow-scrolling:touch}
.passage-pane{background:var(--paper)}
.wm{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='380' height='230'><text x='190' y='120' text-anchor='middle' transform='rotate(-24 190 115)' font-family='Arial,sans-serif' font-size='15' font-weight='700' letter-spacing='3' fill='%23D9435F' fill-opacity='0.075'>ENGLISH THOUGHTS / HOANG HAI HA</text></svg>");}
.wm::after{content:"";position:absolute;inset:0;background:var(--wm-logo) center/min(62%,330px) no-repeat;opacity:.085}
.passage{max-width:72ch;margin:0 auto;padding:26px 28px 60px;font-family:var(--f-read);font-size:var(--read-size,17px);line-height:1.72}
.passage .eyebrow{font-family:var(--f-body)}
.passage h2{font-size:28px;margin:6px 0 4px}
.passage .lead{font-family:var(--f-body);font-size:13.5px;color:var(--muted);margin:0 0 20px;padding:10px 12px;border-left:3px solid var(--pink);background:var(--surface)}
.passage p{margin:0 0 16px}
.passage .pl{font-family:var(--f-body);font-weight:700;color:var(--rose);margin-right:8px}
.divider{background:var(--line);cursor:col-resize;position:relative;touch-action:none}
.divider::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:4px;background:var(--pink)}
.divider:hover,.divider.drag{background:var(--pink)}
.q-pane{background:var(--bg)}
.qwrap{padding:22px 24px 60px;max-width:760px}
.qgroup{margin-bottom:30px}
.qgroup h3{font-size:20px;margin-bottom:6px}
.instr{font-size:14px;color:var(--muted);margin:0 0 12px}
.instr strong{color:var(--navy)}
.box{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);margin-bottom:14px}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--rose)}
.heads{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14.5px}
.heads b{display:inline-block;min-width:34px;color:var(--navy)}
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);scroll-margin:20px}
.q:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--blush);color:var(--rose-ink)}
.q.answered .qn{background:#1E2A4F;color:#fff}
.q-text{margin:3px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;padding:6px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;font-weight:600;background:var(--surface);cursor:pointer}
.opt input:checked+span{background:#1E2A4F;border-color:#1E2A4F;color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--rose);outline-offset:2px}
.mcq .opts{flex-direction:column;align-items:stretch}
.mcq .opt span{display:block;font-weight:500}
.mcq .opt span b{margin-right:8px}
select.input{width:auto;min-width:120px;padding:7px 10px}
.gap{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline}
.gap b{font-size:12px;color:var(--rose);font-weight:700}
.gap input{border:none;border-bottom:2px solid var(--pink);background:var(--blush);border-radius:6px 6px 0 0;padding:3px 8px;width:9.5em;max-width:46vw;font-weight:600}
.gap input:focus{outline:none;border-bottom-color:var(--rose)}
.summary{line-height:2.25;font-size:15.5px}
.t-foot{display:flex;align-items:center;gap:12px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.qnav{display:flex;gap:5px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.qnav button{flex:0 0 auto;width:34px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;cursor:pointer}
.qnav button.on{background:#1E2A4F;border-color:#1E2A4F;color:#fff}
.progress{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
mark.hl{color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
mark.hl-1{background:var(--hl1)} mark.hl-2{background:var(--hl2)} mark.hl-3{background:var(--hl3)}
#hlbar{position:fixed;z-index:60;display:flex;gap:6px;align-items:center;background:#1E2A4F;padding:6px 8px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#hlbar button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.7);cursor:pointer}
#hlbar .c1{background:#FFE38A} #hlbar .c2{background:#F9BFD0} #hlbar .c3{background:#BFD9FF}
#hlbar .x{background:transparent;color:#fff;border-radius:8px;width:auto;padding:0 8px;font-size:12px;font-weight:600}
@media (max-width:820px){
  .t-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface)}
  .t-tabs button{flex:1;padding:10px;border:0;background:transparent;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
  .t-tabs button[aria-selected="true"]{color:var(--rose);border-bottom-color:var(--rose)}
  .split{grid-template-columns:minmax(0,1fr)!important}
  .divider{display:none}
  .split[data-tab="passage"] .q-pane,.split[data-tab="questions"] .passage-pane{display:none}
  .hl-legend,.t-head .hide-sm{display:none}
  .t-head img{height:30px}
  .timer{font-size:18px;padding:4px 9px}
  .passage{padding:20px 16px 50px}
  .qwrap{padding:18px 16px 50px}
}

.passage .intro{font-style:italic;color:var(--muted);margin-bottom:18px}
.passage .fnote{font-family:var(--f-body);font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.q.example{opacity:.85}
.q.example .qn{font-size:11px;background:var(--line);color:var(--muted)}
.qtable{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;background:var(--surface)}
.qtable th{background:#1E2A4F;color:#fff;text-align:left;padding:8px 10px;font-size:13px}
.qtable td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;line-height:2}
/* ---------- results ---------- */
.result{position:relative}
.result .wm{position:fixed}
.result > .wrap{position:relative;z-index:1;padding-block:26px 40px}
.r-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:18px}
.r-top h1{font-size:clamp(26px,3.6vw,36px)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--navy);line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:18px;color:var(--muted)}
.tile .s{font-size:13px;color:var(--muted)}
.tile.main{background:#1E2A4F;border-color:#1E2A4F}
.tile.main .k,.tile.main .s{color:#C9CDE6}
.tile.main .v{color:#fff}
.tile.main .v small{color:#F2A6BC}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;margin-top:20px;align-items:start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .name{font-weight:600;font-size:14px}
.trow .frac{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:8px;border-radius:6px;background:var(--bad-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.trow .note{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.review{width:100%;border-collapse:collapse;font-size:14px}
.review th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--line)}
.review td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.review tr.exp-row td{border-bottom:1px solid var(--line);padding-top:0}
.review tr:has(+ .exp-row) td{border-bottom:0}
.exp{display:block;font-size:13px;color:var(--muted);background:var(--paper);border-radius:8px;padding:6px 10px}
.review tr.wrong td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.review tr.right td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:700}
.mark.ok{background:var(--good-bg);color:var(--good)} .mark.no{background:var(--bad-bg);color:var(--bad)}
.ans-no{color:var(--bad);font-weight:600} .ans-ok{color:var(--good);font-weight:600}
.scroll-x{overflow-x:auto}
.send{margin-top:20px;background:var(--blush);border:1.5px solid var(--pink);border-radius:14px;padding:16px}
.send h2{font-size:20px}
.send ol{margin:8px 0 12px;padding-left:20px;font-size:14px}
.code{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;border:1.5px solid var(--pink);border-radius:10px;padding:10px;background:var(--surface);resize:vertical;min-height:84px;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toast{font-size:13px;font-weight:600;color:var(--good)}

/* ---------- teacher ---------- */
.notice{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.notice.ok{border-color:var(--good);background:var(--good-bg)}
.import{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 12px;align-items:end}
.filters .field{flex:1 1 160px}
table.list{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:hover td{background:var(--paper)}
.score-pill{display:inline-block;min-width:54px;text-align:center;font-weight:700;padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.sp-hi{background:var(--good-bg);color:var(--good)} .sp-mid{background:var(--blush);color:var(--rose-ink)} .sp-lo{background:var(--bad-bg);color:var(--bad)}
.weak{font-size:12.5px;color:var(--bad)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(18,25,51,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:5px solid var(--rose)}
.modal h3{font-size:22px;margin-bottom:8px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .row{justify-content:flex-end}

@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;padding-block:26px 20px}
  .hero-logo{display:none}
  .student-card{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
  .import{grid-template-columns:1fr}
  .brand img{height:44px}
}
</style>

  "title": "Spoken Corpus Comes to Life",
  "topic": "Language",
  "added": "2026-11-04",
  "paras": [
   [
    "A",
    "The compiling of dictionaries has been historically the provenance of studious professorial types – usually bespectacled – who love to pore over weighty tomes and make pronouncements on the finer nuances of meaning. They were probably good at crosswords and definitely knew a lot of words, but the image was always rather dry and dusty. The latest technology, and simple technology at that, is revolutionising the content of dictionaries and the way they are put together."
   ],
   [
    "B",
    "For the first time, dictionary publishers are incorporating real, spoken English into their data. It gives lexicographers (people who write dictionaries) access to a more vibrant, up-to-date vernacular language which has never really been studied before. In one project, 150 volunteers each agreed to discreetly tie a Walkman recorder to their waist and leave it running for anything up to two weeks. Every conversation they had was recorded. When the data was collected, the length of tapes was 35 times the depth of the Atlantic Ocean. Teams of audio typists transcribed the tapes to produce a computerised database of ten million words."
   ],
   [
    "C",
    "This has been the basis – along with an existing written corpus – for the Language Activator dictionary, described by lexicographer Professor Randolph Quirk as \"the book the world has been waiting for\". It shows advanced foreign learners of English how the language is really used. In the dictionary, key words such as \"eat\" are followed by related phrases such as \"wolf down\" or \"be a picky eater\", allowing the student to choose the appropriate phrase."
   ],
   [
    "D",
    "\"This kind of research would be impossible without computers,\" said Delia Summers, a director of dictionaries. \"It has transformed the way lexicographers work. If you look at the word 'like', you may intuitively think that the first and most frequent meaning is the verb, as in 'I like swimming'. It is not. It is the preposition, as in: 'she walked like a duck'. Just because a word or phrase is used doesn't mean it ends up in a dictionary. The sifting out process is as vital as ever. But the database does allow lexicographers to search for a word and find out how frequently it is used – something that could only be guessed at intuitively before.\""
   ],
   [
    "E",
    "Researchers have found that written English works in a very different way to spoken English. The phrase \"say what you like\" literally means \"feel free to say anything you want\", but in reality it is used, evidence shows, by someone to prevent the other person voicing disagreement. The phrase \"it's a question of\" crops up on the database over and over again. It has nothing to do with enquiry, but it's one of the most frequent English phrases which has never been in a language learner's dictionary before: it is now."
   ],
   [
    "F",
    "The Spoken Corpus computer shows how inventive and humorous people are when they are using language by twisting familiar phrases for effect. It also reveals the power of the pauses and noises we use to play for time, convey emotion, doubt and irony."
   ],
   [
    "G",
    "For the moment, those benefiting most from the Spoken Corpus are foreign learners. \"Computers allow lexicographers to search quickly through more examples of real English,\" said Professor Geoffrey Leech of Lancaster University. \"They allow dictionaries to be more accurate and give a feel for how language is being used.\" The Spoken Corpus is part of the larger British National Corpus, an initiative carried out by several groups involved in the production of language learning materials: publishers, universities and the British Library."

  "title": "Stepwells",
  "topic": "Architecture & History",
  "added": "2026-11-04",
  "intro": "A millennium ago, stepwells were fundamental to life in the driest parts of India. Although many have been neglected, recent restoration has returned them to their former glory. Richard Cox travelled to north-western India to document these spectacular monuments from a bygone era.",
  "paras": [
   [
    "",
    "During the sixth and seventh centuries, the inhabitants of the modern-day states of Gujarat and Rajasthan in north-western India developed a method of gaining access to clean, fresh groundwater during the dry season for drinking, bathing, watering animals and irrigation. However, the significance of this invention – the stepwell – goes beyond its utilitarian application."
   ],
   [
    "",
    "Unique to the region, stepwells are often architecturally complex and vary widely in size and shape. During their heyday, they were places of gathering, of leisure, of relaxation and of worship for villagers of all but the lowest castes. Most stepwells are found dotted around the desert areas of Gujarat (where they are called vav) and Rajasthan (where they are known as baori), while a few also survive in Delhi. Some were located in or near villages as public spaces for the community; others were positioned beside roads as resting places for travellers."
   ],
   [
    "",
    "As their name suggests, stepwells comprise a series of stone steps descending from ground level to the water source (normally an underground aquifer) as it recedes following the rains. When the water level was high, the user needed only to descend a few steps to reach it; when it was low, several levels would have to be negotiated."
   ],
   [
    "",
    "Some wells are vast, open craters with hundreds of steps paving each sloping side, often in tiers. Others are more elaborate, with long stepped passages leading to the water via several storeys built from stone and supported by pillars; they also included pavilions that sheltered visitors from the relentless heat. But perhaps the most impressive features are the intricate decorative sculptures that embellish many stepwells, showing activities from fighting and dancing to everyday acts such as women combing their hair and churning butter."
   ],
   [
    "",
    "Down the centuries, thousands of wells were constructed throughout northwestern India, but the majority have now fallen into disuse; many are derelict and dry, as groundwater has been diverted for industrial use and the wells no longer reach the water table. Their condition hasn't been helped by recent dry spells: southern Rajasthan suffered an eight-year drought between 1996 and 2004."
   ],
   [
    "",
    "However, some important sites in Gujarat have recently undergone major restoration, and the state government announced in June last year that it plans to restore the stepwells throughout the state."
   ],
   [
    "",
    "In Patan, the state's ancient capital, the stepwell of Rani Ki Vav (Queen's Stepwell) is perhaps the finest current example. It was built by Queen Udayamati during the late 11th century, but became silted up following a flood during the 13th century. But the Archaeological Survey of India began restoring it in the 1960s, and today it's in pristine condition. At 65 metres long, 20 metres wide and 27 metres deep, Rani Ki Vav features 500 distinct sculptures carved into niches throughout the monument, depicting gods such as Vishnu and Parvati in various incarnations. Incredibly, in January 2001, this ancient structure survived a devastating earthquake that measured 7.6 on the Richter scale."
   ],
   [
    "",
    "Another example is the Surya Kund in Modhera, northern Gujarat, next to the Sun Temple, built by King Bhima I in 1026 to honour the sun god Surya. It actually resembles a tank (kund means reservoir or pond) rather than a well, but displays the hallmarks of stepwell architecture, including four sides of steps that descend to the bottom in a stunning geometrical formation. The terraces house 108 small, intricately carved shrines between the sets of steps."
   ],
   [
    "",
    "Rajasthan also has a wealth of wells. The ancient city of Bundi, 200 kilometres south of Jaipur, is renowned for its architecture, including its stepwells. One of the larger examples is Raniji Ki Baori, which was built by the queen of the region, Nathavatji, in 1699. At 46 metres deep, 20 metres wide and 40 metres long, the intricately carved monument is one of 21 baoris commissioned in the Bundi area by Nathavatji."
   ],
   [
    "",
    "In the old ruined town of Abhaneri, about 95 kilometres east of Jaipur, is Chand Baori, one of India's oldest and deepest wells; aesthetically, it's perhaps one of the most dramatic. Built in around 850 AD next to the temple of Harshat Mata, the baori comprises hundreds of zigzagging steps that run along three of its sides, steeply descending 11 storeys, resulting in a striking geometric pattern when seen from afar. On the fourth side, covered verandas supported by ornate pillars overlook the steps."
   ],
   [
    "",
    "Still in public use is Neemrana Ki Baori, located just off the Jaipur–Delhi highway. Constructed in around 1700, it's nine storeys deep, with the last two levels being underwater. At ground level, there are 86 colonnaded openings from where the visitor descends 170 steps to the deepest water source."
   ],
   [
    "",
    "Today, following years of neglect, many of these monuments to medieval engineering have been saved by the Archaeological Survey of India, which has recognised the importance of preserving them as part of the country's rich history. Tourists flock to wells in far-flung corners of northwestern India to gaze in wonder at these architectural marvels from 1,000 years ago, which serve as a reminder of both the ingenuity and artistry of ancient civilisations and of the value of water to human existence."
   ]

  "id": "pr04",

  "title": "European Transport Systems 1990–2010",
  "topic": "Transport",
  "added": "2026-11-04",
  "intro": "What have been the trends and what are the prospects for European transport systems?",
  "paras": [
   [
    "A",
    "It is difficult to conceive of vigorous economic growth without an efficient transport system. Although modern information technologies can reduce the demand for physical transport by facilitating teleworking and teleservices, the requirement for transport continues to increase. There are two key factors behind this trend. For passenger transport, the determining factor is the spectacular growth in car use. The number of cars on European Union (EU) roads saw an increase of three million cars each year from 1990 to 2010, and in the next decade the EU will see a further substantial increase in its fleet."
   ],
   [
    "B",
    "As far as goods transport is concerned, growth is due to a large extent to changes in the European economy and its system of production. In the last 20 years, as internal frontiers have been abolished, the EU has moved from a 'stock' economy to a 'flow' economy. This phenomenon has been emphasised by the relocation of some industries, particularly those which are labour intensive, to reduce production costs, even though the production site is hundreds or even thousands of kilometres away from the final assembly plant or away from users."
   ],
   [
    "C",
    "The strong economic growth expected in countries which are candidates for entry to the EU will also increase transport flows, in particular road haulage traffic. In 1998, some of these countries already exported more than twice their 1990 volumes and imported more than five times their 1990 volumes. And although many candidate countries inherited a transport system which encourages rail, the distribution between modes has tipped sharply in favour of road transport since the 1990s. Between 1990 and 1998, road haulage increased by 19.4%, while during the same period rail haulage decreased by 43.5%, although – and this could benefit the enlarged EU – it is still on average at a much higher level than in existing member states."
   ],
   [
    "D",
    "However, a new imperative – sustainable development – offers an opportunity for adapting the EU's common transport policy. This objective, agreed by the Gothenburg European Council, has to be achieved by integrating environmental considerations into Community policies, and shifting the balance between modes of transport lies at the heart of its strategy. The ambitious objective can only be fully achieved by 2020, but proposed measures are nonetheless a first essential step towards a sustainable transport system which will ideally be in place in 30 years' time, that is by 2040."
   ],
   [
    "E",
    "In 1998, energy consumption in the transport sector was to blame for 28% of emissions of CO2, the leading greenhouse gas. According to the latest estimates, if nothing is done to reverse the traffic growth trend, CO2 emissions from transport can be expected to increase by around 50% to 1,113 billion tonnes by 2020, compared with the 739 billion tonnes recorded in 1990. Once again, road transport is the main culprit since it alone accounts for 84% of the CO2 emissions attributable to transport. Using alternative fuels and improving energy efficiency is thus both an ecological necessity and a technological challenge."
   ],
   [
    "F",
    "At the same time greater efforts must be made to achieve a modal shift. Such a change cannot be achieved overnight, all the less so after over half a century of constant deterioration in favour of road. This has reached such a pitch that today rail freight services are facing marginalisation, with just 8% of market share, and with international goods trains struggling along at an average speed of 18km/h. Three possible options have emerged."
   ],
   [
    "G",
    "The first approach would consist of focusing on road transport solely through pricing. This option would not be accompanied by complementary measures in the other modes of transport. In the short term it might curb the growth in road transport through the better loading ratio of goods vehicles and occupancy rates of passenger vehicles expected as a result of the increase in the price of transport. However, the lack of measures available to revitalise other modes of transport would make it impossible for more sustainable modes of transport to take up the baton."
   ],
   [
    "H",
    "The second approach also concentrates on road transport pricing but is accompanied by measures to increase the efficiency of the other modes (better quality of services, logistics, technology). However, this approach does not include investment in new infrastructure, nor does it guarantee better regional cohesion. It could help to achieve greater uncoupling than the first approach, but road transport would keep the lion's share of the market and continue to concentrate on saturated arteries, despite being the most polluting of the modes. It is therefore not enough to guarantee the necessary shift of the balance."
   ],
   [
    "I",
    "The third approach, which is not new, comprises a series of measures ranging from pricing to revitalising alternative modes of transport and targeting investment in the trans-European network. This integrated approach would allow the market shares of the other modes to return to their 1998 levels and thus make a shift of balance. It is far more ambitious than it looks, bearing in mind the historical imbalance in favour of roads for the last fifty years, but would achieve a marked break in the link between road transport growth and economic growth, without placing restrictions on the mobility of people and goods."
   ]
  ],

  "paras": [
   [
    "A",
    "Alan Macfarlane, professor of anthropological science at King's College, Cambridge has, like other historians, spent decades wrestling with the enigma of the Industrial Revolution. Why did this particular Big Bang – the world-changing birth of industry – happen in Britain? And why did it strike at the end of the 18th century?"
   ],
   [
    "B",
    "Macfarlane compares the puzzle to a combination lock. 'There are about 20 different factors and all of them need to be present before the revolution can happen,' he says. For industry to take off, there needs to be the technology and power to drive factories, large urban populations to provide cheap labour, easy transport to move goods around, an affluent middle-class willing to buy mass-produced objects, a market-driven economy and a political system that allows this to happen. While this was the case for England, other nations, such as Japan, the Netherlands and France also met some of these criteria but were not industrialising. 'All these factors must have been necessary but not sufficient to cause the revolution,' says Macfarlane. 'After all, Holland had everything except coal, while China also had many of these factors. Most historians are convinced there are one or two missing factors that you need to open the lock.'"
   ],
   [
    "C",
    "The missing factors, he proposes, are to be found in almost every kitchen cupboard. Tea and beer, two of the nation's favourite drinks, fuelled the revolution. The antiseptic properties of tannin, the active ingredient in tea, and of hops in beer – plus the fact that both are made with boiled water – allowed urban communities to flourish at close quarters without succumbing to water-borne diseases such as dysentery. The theory sounds eccentric but once he starts to explain the detective work that went into his deduction, the scepticism gives way to wary admiration. Macfarlane's case has been strengthened by support from notable quarters – Roy Porter, the distinguished medical historian, recently wrote a favourable appraisal of his research."
   ],
   [
    "D",
    "Macfarlane had wondered for a long time how the Industrial Revolution came about. Historians had alighted on one interesting factor around the mid-18th century that required explanation. Between about 1650 and 1740, the population in Britain was static. But then there was a burst in population growth. Macfarlane says: 'The infant mortality rate halved in the space of 20 years, and this happened in both rural areas and cities, and across all classes. People suggested four possible causes. Was there a sudden change in the viruses and bacteria around? Unlikely. Was there a revolution in medical science? But this was a century before Lister's revolution*. Was there a change in environmental conditions? There were improvements in agriculture that wiped out malaria, but these were small gains. Sanitation did not become widespread until the 19th century. The only option left is food. But the height and weight statistics show a decline. So the food must have got worse. Efforts to explain this sudden reduction in child deaths appeared to draw a blank.'"
   ],
   [
    "E",
    "This population burst seemed to happen at just the right time to provide labour for the Industrial Revolution. 'When you start moving towards an industrial revolution, it is economically efficient to have people living close together,' says Macfarlane. 'But then you get disease, particularly from human waste.' Some digging around in historical records revealed that there was a change in the incidence of water-borne disease at that time, especially dysentery. Macfarlane deduced that whatever the British were drinking must have been important in regulating disease. He says, 'We drank beer. For a long time, the English were protected by the strong antibacterial agent in hops, which were added to help preserve the beer. But in the late 17th century a tax was introduced on malt, the basic ingredient of beer. The poor turned to water and gin and in the 1720s the mortality rate began to rise again. Then it suddenly dropped again. What caused this?'"
   ],
   [
    "F",
    "Macfarlane looked to Japan, which was also developing large cities about the same time, and also had no sanitation. Water-borne diseases had a much looser grip on the Japanese population than those in Britain. Could it be the prevalence of tea in their culture? Macfarlane then noted that the history of tea in Britain provided an extraordinary coincidence of dates. Tea was relatively expensive until Britain started a direct clipper trade with China in the early 18th century. By the 1740s, about the time that infant mortality was dipping, the drink was common. Macfarlane guessed that the fact that water had to be boiled, together with the stomach-purifying properties of tea, meant that the breast milk provided by mothers was healthier than it had ever been. No other European nation sipped tea like the British, which, by Macfarlane's logic, pushed these other countries out of contention for the revolution."
   ],
   [
    "G",
    "But, if tea is a factor in the combination lock, why didn't Japan forge ahead in a tea-soaked industrial revolution of its own? Macfarlane notes that even though 17th-century Japan had large cities, high literacy rates, even a futures market, it had turned its back on the essence of any work-based revolution by giving up labour-saving devices such as animals, afraid that they would put people out of work. So, the nation that we now think of as one of the most technologically advanced entered the 19th century having 'abandoned the wheel'."
   ]

    "Travel has existed since the beginning of time, when primitive man set out, often traversing great distances in search of game, which provided the food and clothing necessary for his survival. Throughout the course of history, people have travelled for purposes of trade, religious conviction, economic gain, war, migration and other equally compelling motivations. In the Roman era, wealthy aristocrats and high government officials also travelled for pleasure. Seaside resorts located at Pompeii and Herculaneum afforded citizens the opportunity to escape to their vacation villas in order to avoid the summer heat of Rome. Travel, except during the Dark Ages, has continued to grow and, throughout recorded history, has played a vital role in the development of civilisations and their economies."

const dateVN = ms => { const d = new Date(ms); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const norm = s => String(s || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
const ROMAN = ["i","ii","iii","iv","v","vi","vii","viii","ix","x","xi","xii"];

function groupNums(g) {
  const src = g.text || (g.rows && g.rows.flat().join(" "));
  if (src) return [...src.matchAll(/\[\[(\d+)\]\]/g)].map(m => +m[1]);
  return g.qs.map(q => q.n);
}
function questionsOf(t) {
  const out = [];
  t.groups.forEach(g => groupNums(g).forEach(n => out.push({ n, type: g.type })));
  return out.sort((a, b) => a.n - b.n);
}
function bandFrom(correct, total) {
  const r = Math.round(correct / total * 40);
  const table = [[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,0]];
  for (const [min, b] of table) if (r >= min) return b === 0 ? "—" : b.toFixed(1);
  return "—";
}
function grade(res) {
  const t = testById(res.id), key = KEYS[res.id] || {};
  const items = questionsOf(t).map(q => {
    const user = String((res.a || {})[q.n] || "").trim();
    const acc = key[q.n] || [""];
    const ok = !!user && acc.some(k => norm(k) === norm(user));
    return { n: q.n, type: q.type, user, correct: acc.join(" / "), ok, exp: (EXPL[res.id] || {})[q.n] || "" };
  });
  const byType = {};
  items.forEach(i => { const b = byType[i.type] || (byType[i.type] = { c: 0, t: 0, wrong: [] }); b.t++; if (i.ok) b.c++; else b.wrong.push(i.n); });
  const correct = items.filter(i => i.ok).length;
  return { items, correct, total: items.length, byType, band: bandFrom(correct, items.length) };
}
function b64u(str) { const by = new TextEncoder().encode(str); let bin = ""; by.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64u(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }
const encodeResult = r => "ET-" + b64u(JSON.stringify(r));
function decodeResult(code) {
  try {
    const r = JSON.parse(unb64u(code.replace(/^ET-/, "")));
    if (!r || !testById(r.id) || typeof r.a !== "object" || typeof r.s !== "number") return null;
    r.n = String(r.n || "").slice(0, 80); r.c = String(r.c || "").slice(0, 40);
    return r;
  } catch (e) { return null; }
}
function hashCode(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return "r" + h.toString(36) + s.length.toString(36); }

function inlineGaps(text) {
  return esc(text).replace(/\[\[(\d+)\]\]/g, (_, n) => `<span class="gap no-hl" id="q-${n}"><b>${n}</b><input type="text" data-q="${n}" aria-label="Câu ${n}" autocomplete="off" spellcheck="false"></span>`);
}
function groupHTML(g) {
  let h = `<section class="qgroup"><div class="eyebrow">Questions ${g.range}</div><h3>${TYPE_LABEL[g.type]}</h3><p class="instr">${g.instr}</p>`;
  if (g.type === "headings") {
    h += `<div class="box q-text-hl"><h4>List of Headings</h4><ul class="heads">${g.list.map(([r, t]) => `<li><b>${r}</b>${esc(t)}</li>`).join("")}</ul></div>`;
    if (g.example) h += `<div class="q example"><div class="qn">Ex</div><div class="row"><span style="font-weight:600">Paragraph ${g.example[0]}</span><span class="chip">Answer: ${g.example[1]}</span><span class="muted" style="font-size:13px">(ví dụ mẫu)</span></div></div>`;
    h += g.qs.map(q => `<div class="q" id="q-${q.n}"><div class="qn">${q.n}</div><div class="row"><span style="font-weight:600">Paragraph ${q.p}</span>
      <select class="input" data-q="${q.n}" aria-label="Câu ${q.n}: heading cho paragraph ${q.p}"><option value="">– chọn –</option>${g.list.map(([r]) => `<option value="${r}">${r}</option>`).join("")}</select></div></div>`).join("");
  } else if (g.type === "tfng" || g.type === "ynng") {
    const o = g.type === "tfng" ? ["TRUE", "FALSE", "NOT GIVEN"] : ["YES", "NO", "NOT GIVEN"];
    h += g.qs.map(q => `<div class="q" id="q-${q.n}"><div class="qn">${q.n}</div><div><p class="q-text q-text-hl">${esc(q.t)}</p>
      <div class="opts">${o.map(v => `<label class="opt"><input type="radio" name="q${q.n}" value="${v}" data-q="${q.n}"><span>${v}</span></label>`).join("")}</div></div></div>`).join("");
  } else if (g.type === "mcq") {
    h += g.qs.map(q => `<div class="q mcq" id="q-${q.n}"><div class="qn">${q.n}</div><div><p class="q-text q-text-hl">${esc(q.t)}</p>
      <div class="opts">${q.o.map((t, i) => { const L = "ABCDEFG"[i]; return `<label class="opt"><input type="radio" name="q${q.n}" value="${L}" data-q="${q.n}"><span><b>${L}</b>${esc(t)}</span></label>`; }).join("")}</div></div></div>`).join("");
  } else if (g.type === "matchinfo") {
    h += g.qs.map(q => `<div class="q" id="q-${q.n}"><div class="qn">${q.n}</div><div><p class="q-text q-text-hl">${esc(q.t)}</p>
      <select class="input" data-q="${q.n}" aria-label="Câu ${q.n}"><option value="">– chọn –</option>${g.letters.map(l => `<option value="${l}">${l}</option>`).join("")}</select></div></div>`).join("");
  } else if (g.type === "matchfeat") {
    h += `<div class="box q-text-hl"><h4>${esc(g.listTitle || "List")}</h4><ul class="heads">${g.list.map(([r, t]) => `<li><b>${r}</b>${esc(t)}</li>`).join("")}</ul></div>`;
    h += g.qs.map(q => `<div class="q" id="q-${q.n}"><div class="qn">${q.n}</div><div class="row"><span class="q-text-hl" style="font-weight:600">${esc(q.t)}</span>
      <select class="input" data-q="${q.n}" aria-label="Câu ${q.n}: ${esc(q.t)}"><option value="">– chọn –</option>${g.list.map(([l]) => `<option value="${l}">${l}</option>`).join("")}</select></div></div>`).join("");
  } else if (g.type === "table") {
    h += `<div class="scroll-x"><table class="qtable"><thead><tr>${g.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${g.rows.map(r => `<tr>${r.map((c, i) => `<td class="q-text-hl">${i === 0 ? "<b>" + inlineGaps(c) + "</b>" : inlineGaps(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  } else if (g.type === "summary") {
    h += `<div class="box"><h4>${esc(g.title)}</h4><p class="summary q-text-hl" style="margin:0">${inlineGaps(g.text)}</p></div>`;
  } else if (g.type === "sentence") {
    h += g.qs.map(q => `<div class="q"><div class="qn">${q.n}</div><p class="q-text q-text-hl" style="line-height:2">${inlineGaps(q.t)}</p></div>`).join("");
  } else if (g.type === "short") {
    h += g.qs.map(q => `<div class="q"><div class="qn">${q.n}</div><div><p class="q-text q-text-hl">${esc(q.t)}</p><span class="gap no-hl" id="q-${q.n}"><input type="text" data-q="${q.n}" aria-label="Câu ${q.n}" autocomplete="off" spellcheck="false" placeholder="Câu trả lời"></span></div></div>`).join("");
  }
  return h + `</section>`;
}

let pending = null;
const bar = $("#hlbar");
function hlZone(node) { const el = node && (node.nodeType === 1 ? node : node.parentElement); return el && el.closest("#passage, .q-text-hl"); }
function hideBar() { bar.hidden = true; pending = null; }
function showBar(rect, onMark) {
  bar.querySelector(".x").textContent = onMark ? "Bỏ tô" : "Xoá";
  bar.hidden = false;
  const bw = bar.offsetWidth, bh = bar.offsetHeight;
  let x = rect.left + rect.width / 2 - bw / 2, y = rect.top - bh - 8;
  if (y < 8) y = rect.bottom + 8;
  x = Math.max(8, Math.min(window.innerWidth - bw - 8, x));
  bar.style.left = x + "px"; bar.style.top = y + "px";
}
function onSelEnd(e) {
  if (S.view !== "test") return;
  if (e && e.target && e.target.closest && e.target.closest("#hlbar")) return;
  if (e && e.target && e.target.closest && e.target.closest(".modal-bg, button")) return hideBar();
  setTimeout(() => {
    if (S.view !== "test") return hideBar();
    const sel = getSelection();
    if (!sel.rangeCount || sel.isCollapsed) {
      const m = e && e.target && e.target.closest && e.target.closest("mark.hl");
      if (m) { pending = { mark: m }; showBar(m.getBoundingClientRect(), true); } else hideBar();
      return;
    }
    const r = sel.getRangeAt(0);
    if (!hlZone(r.commonAncestorContainer) || !r.toString().trim()) return hideBar();
    pending = { range: r.cloneRange() };
    showBar(r.getBoundingClientRect(), false);
  }, 0);
}
document.addEventListener("mouseup", onSelEnd);
document.addEventListener("touchend", onSelEnd);
document.addEventListener("keyup", e => { if (e.shiftKey) onSelEnd(e); });
document.addEventListener("scroll", () => { if (!bar.hidden) hideBar(); }, true);
bar.addEventListener("mousedown", e => e.preventDefault());
bar.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !pending) return;
  const c = b.dataset.c;
  if (pending.mark) { if (c === "0") unwrap(pending.mark); else pending.mark.className = "hl hl-" + c; }
  else if (pending.range) {
    if (c === "0") { const zone = hlZone(pending.range.commonAncestorContainer); $$("mark.hl", zone.closest("#passage") || zone).filter(m => pending.range.intersectsNode(m)).forEach(unwrap); }
    else wrapRange(pending.range, c);
  }
  getSelection().removeAllRanges(); hideBar(); saveHl();
});
function wrapRange(range, c) {
  const zone = hlZone(range.commonAncestorContainer); if (!zone) return;
  const nodes = [];
  const w = document.createTreeWalker(zone, NodeFilter.SHOW_TEXT, { acceptNode: n => {
    if (!range.intersectsNode(n) || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    if (n.parentElement.closest("select,option,button,input,textarea,.no-hl")) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; } });
  if (zone.nodeType === 3) nodes.push(zone);
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) {
    let s = 0, e = n.nodeValue.length;
    if (n === range.startContainer) s = range.startOffset;
    if (n === range.endContainer) e = range.endOffset;
    if (s >= e) continue;
    const pm = n.parentElement.closest("mark.hl");
    if (pm && s === 0 && e === n.nodeValue.length) { pm.className = "hl hl-" + c; continue; }
    let target = n;
    if (e < target.nodeValue.length) target.splitText(e);
    if (s > 0) target = target.splitText(s);

    existing.add(id);
    if (IS_TEACHER) {
      try { await DB.collection("results").doc(id).set({ code, name: r.n, cls: r.c, testId: r.id, secs: r.s, submittedAt: r.d, addedAt: Date.now() }); added++; }
      catch (e) { bad++; dbErr = "Không lưu được (" + (e.code || "lỗi") + ")."; }
    } else { local.push({ id, code }); added++; }
  }
  if (!IS_TEACHER) store.set("et_teacher_local", local);
  btn.disabled = false;
  const parts = [`Đã thêm ${added} kết quả`]; if (dup) parts.push(`${dup} mã trùng đã bỏ qua`); if (bad) parts.push(`${bad} mã không hợp lệ`);
  const text = parts.join(" · ") + ".";
  render();
  const m2 = $("#importMsg"); if (m2) { m2.style.color = bad ? "var(--bad)" : ""; m2.textContent = text; }
}
async function deleteRow(id) {
  if (IS_TEACHER) { try { await DB.collection("results").doc(id).delete(); } catch (e) { dbErr = "Không xoá được (" + (e.code || "lỗi") + ")."; render(); } }
  else { store.set("et_teacher_local", localRows().filter(r => r.id !== id)); render(); }
}

/* ======================= KẾT NỐI KHO KẾT QUẢ ======================= */
async function connect() {
  const finishCheck = () => { dbReady = true; if (S.view === "teacher") render(); };
  if (!window.claude || !window.claude.use) return finishCheck();
  try {
    USER = await window.claude.use("user");
    DB = await window.claude.use("db");
    const canEdit = USER ? await USER.canEdit() : false;
    if (DB && canEdit) {
      IS_TEACHER = true;
      const to = setTimeout(() => { dbErr = "Kho kết quả phản hồi chậm."; finishCheck(); }, 10000);
      DB.collection("results").onSnapshot(snap => {
        clearTimeout(to);
        dbRows = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
        dbReady = true;
        if (S.view === "teacher") render();
      }, err => { clearTimeout(to); IS_TEACHER = false; dbErr = "Không đọc được kho kết quả (" + (err.code || "lỗi") + ")."; finishCheck(); });
      return;
    }
  } catch (e) {}
  finishCheck();
}

/* ======================= MODAL ======================= */
function modal(title, html, actions) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${html}</p><div class="row"></div></div>`;
  const row = bg.querySelector(".row");
  actions.forEach(a => { const b = document.createElement("button"); b.className = "btn " + (a.cls || ""); b.textContent = a.label; b.addEventListener("click", () => { bg.remove(); a.fn && a.fn(); }); row.appendChild(b); });
  bg.addEventListener("click", e => { if (e.target === bg && actions.length > 1) bg.remove(); });
  document.body.appendChild(bg);
  const last = row.lastElementChild; if (last) last.focus();
}

/* ======================= KHỞI ĐỘNG ======================= */
(function boot() {
  const prog = store.get("et_progress", null);
  if (prog && testById(prog.id) && (Date.now() - prog.start) / 1000 >= LIMIT) {
    S.prog = prog; finish(true);
  } else route();
  connect();
})();
</script>
